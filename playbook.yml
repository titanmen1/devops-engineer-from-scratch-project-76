---
- name: Prepare servers
  hosts: all
  become: true
  tags:
    - setup
  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
      changed_when: false

    - name: Install pip and its packages
      ansible.builtin.include_role:
        name: geerlingguy.pip

    - name: Install Docker
      ansible.builtin.include_role:
        name: geerlingguy.docker

- name: Deploy Redmine
  hosts: all
  become: true
  serial: 1
  tags:
    - deploy
  tasks:
    - name: Create environment file from template
      ansible.builtin.template:
        src: environment.j2
        dest: /opt/redmine.env
        mode: "0640"

    - name: Run Redmine container
      community.docker.docker_container:
        name: redmine-app
        image: "redmine:{{ redmine_version }}"
        published_ports:
          - "{{ redmine_port }}:3000"
        restart_policy: always
        pull: true
        container_default_behavior: no_defaults
        env_file: /opt/redmine.env

- name: Setup monitoring
  hosts: webservers
  become: true
  tags:
    - monitoring
  roles:
    - role: datadog.datadog
